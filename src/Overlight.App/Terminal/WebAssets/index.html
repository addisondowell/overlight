<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="vendor/xterm/xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c0c0c; overflow: hidden; }
  #terminal { width: 100%; height: 100%; padding: 4px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm-addon-fit/xterm-addon-fit.js"></script>
<script>
  // Bridges xterm.js (the actual terminal emulator: VT/ANSI parsing +
  // rendering) to the WinUI3 host over WebView2's postMessage channel.
  // The host owns ConPTY/the real shell process — this page only ever
  // sees bytes the shell produced and keystrokes the user typed, same
  // as xterm.js does inside VS Code or Hyper.
  const term = new Terminal({
    fontFamily: "Cascadia Mono, Consolas, monospace",
    fontSize: 14,
    theme: {
      background: "#0c0c0c",
      foreground: "#d4d4d4",
      cursor: "#7cfc91",
    },
    cursorBlink: true,
    scrollback: 5000,
  });

  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById("terminal"));

  function postToHost(message) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(message);
    }
  }

  // Every keystroke goes straight to the real shell via the host —
  // this page never interprets or intercepts input itself.
  term.onData(data => postToHost({ type: "input", data }));

  function reportSize() {
    postToHost({ type: "resize", cols: term.cols, rows: term.rows });
  }
  term.onResize(reportSize);

  window.addEventListener("resize", () => fitAddon.fit());

  if (window.chrome && window.chrome.webview) {
    // Host -> page messages are always raw shell output to render.
    window.chrome.webview.addEventListener("message", event => term.write(event.data));
  }

  window.addEventListener("load", () => {
    fitAddon.fit();
    reportSize();
    postToHost({ type: "ready" });
    term.focus();
  });
</script>
</body>
</html>
